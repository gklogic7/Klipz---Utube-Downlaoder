name: Klipz Android CI & APK Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_native_ffmpeg:
        description: "Cross-compile additional custom NDK/JNI LGPL FFmpeg libraries"
        required: false
        default: "false"
        type: boolean

jobs:
  verify-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Optionally build custom NDK LGPL FFmpeg libraries
        if: ${{ github.event.inputs.build_native_ffmpeg == 'true' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          chmod +x scripts/build_ffmpeg_android.sh
          ./scripts/build_ffmpeg_android.sh 7.1

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.example.KlipzCoreAndQueueUnitTest"

      - name: Assemble Debug APK (Bundled Python + yt-dlp + QuickJS/EJS + FFmpeg)
        run: |
          if [ "${{ github.event.inputs.build_native_ffmpeg }}" = "true" ]; then
            ./gradlew :app:assembleDebug -PenableNativeFfmpeg=true
          else
            ./gradlew :app:assembleDebug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klipz-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-signed-release:
    needs: verify-and-build-debug
    if: github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/upload-key.jks"

      - name: Assemble Signed Release APK (Bundled Python + yt-dlp + QuickJS/EJS + FFmpeg)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klipz-release-apk
          path: app/build/outputs/apk/release/*.apk
